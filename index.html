<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141d"><title>Count Timer</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Count Timer"><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><h1>Count Timer</h1><p class="sub">A clearer perspective on time.</p></div><div class="actions"><button id="theme" class="icon" title="Toggle theme">◐</button><button id="addCategory">+ Group</button><button id="addEvent" class="primary">+ Event</button></div></header><div class="toolbar"><input id="search" type="search" placeholder="Search events…" aria-label="Search events"><select id="view" aria-label="View"><option value="grouped">Grouped</option><option value="all">All events</option></select><select id="sort" aria-label="Sort events"><option value="manual">Custom order</option><option value="soon">Nearest date</option><option value="date">Date ascending</option><option value="reverse">Date descending</option><option value="name">Alphabetical</option></select><select id="filter" aria-label="Filter"><option value="all">All time</option><option value="future">Upcoming</option><option value="past">Elapsed</option></select></div><div id="content"></div><div class="toolbar"><button id="export">Export JSON</button><button id="import">Import JSON</button><button id="restore" title="Restore snapshot made before the last import">Restore backup</button><button id="install" class="hidden">Install app</button><input id="file" type="file" accept=".json,application/json" hidden><small>Saved locally on this device</small></div></main>
<dialog id="eventDialog"><form id="eventForm"><h2 id="eventHeading">New event</h2><input type="hidden" name="id"><label>Event name<input name="name" required maxlength="100" placeholder="What are you tracking?"></label><label>Date<input name="date" type="date" required></label><label>Time (optional)<input name="time" type="time"></label><label>Category<select name="category"></select></label><details id="eventAdvanced"><summary>More options</summary><div class="advanced-fields"><label>Counting behavior<select name="mode"><option value="auto">Automatic (up or down)</option><option value="up">Count up from date</option><option value="down">Count down to date</option></select></label><label>Repeat<select name="repeat"><option value="none">Never</option><option value="yearly">Every year</option><option value="monthly">Every month</option><option value="weekly">Every week</option></select></label><label>Precision<select name="precision"><option value="days">Days</option><option value="exact">Days, hours, minutes, seconds</option></select></label><label>Notes<textarea name="notes" rows="2"></textarea></label></div></details><div class="reorder-controls" id="eventReorder"><button type="button" id="eventUp">↑ Move up</button><button type="button" id="eventDown">↓ Move down</button></div><div class="form-actions"><button type="button" id="cancelEvent">Cancel</button><button class="primary">Save event</button></div></form></dialog>
<dialog id="categoryDialog"><form id="categoryForm"><h2>Category</h2><input name="id" type="hidden"><label>Name<input name="name" maxlength="70" required></label><label>Accent color<input name="color" type="color" value="#a9c5ff"></label><div class="reorder-controls" id="categoryReorder"><button type="button" id="categoryUp">↑ Move up</button><button type="button" id="categoryDown">↓ Move down</button></div><div class="form-actions"><button type="button" id="cancelCategory">Cancel</button><button class="primary">Save category</button></div></form></dialog>
<script src="./time-engine.js"></script><script src="./storage.js"></script><script src="./ui.js"></script><script src="./app.js"></script></body></html>
