<script>
(()=>{'use strict';const KEY='count-timer-v1';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const base={categories:[{id:'default',name:'Uncategorized',color:'#a9c5ff',order:0,collapsed:false}],events:[],theme:'dark'};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch{state=structuredClone(base)}if(!Array.isArray(state.categories)||!Array.isArray(state.events))state=structuredClone(base);if(!state.categories.some(c=>c.id==='default'))state.categories.unshift({...base.categories[0]});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Storage is unavailable. Export a backup to avoid losing changes.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const localDate=d=>{const [y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day)};const stamp=e=>{const d=localDate(e.date);if(e.time){const [h,m]=e.time.split(':').map(Number);d.setHours(h,m)}return d};const calendarDelta=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);function effective(e,now){const original=stamp(e);if(e.repeat==='none')return original;const anchorDay=original.getDate(),anchorMonth=original.getMonth();const candidate=(year,month,day)=>{const d=new Date(year,month,1,original.getHours(),original.getMinutes(),0,0);d.setDate(Math.min(day,new Date(year,month+1,0).getDate()));return d};if(e.repeat==='weekly'){const days=Math.max(0,Math.floor((now-original)/604800000));const d=new Date(original);d.setDate(original.getDate()+days*7);while(d<now)d.setDate(d.getDate()+7);return d}if(e.repeat==='monthly'){let months=(now.getFullYear()-original.getFullYear())*12+now.getMonth()-original.getMonth();months=Math.max(0,months);let d=candidate(original.getFullYear(),original.getMonth()+months,anchorD function render(){if(touchDrag||dragged||$('eventDialog').open||$('categoryDialog').open)return;document.body.classList.toggle('light',state.theme==='light');const now=new Date(),query=$('search').value.trim().toLowerCase(),filter=$('filter').value,sort=$('sort').value,grouped=$('view').value==='grouped';let events=state.events.filter(e=>{const t=timing(e,now);return (!query||(e.name+' '+(e.notes||'')).toLowerCase().includes(query))&&(filter==='all'||(filter==='future'?t.sub==='remaining':t.sub==='elapsed'))});const order=(a,b)=>sort==='manual'?(a.order||0)-(b.order||0):sort==='name'?a.name.localeCompare(b.name):sort==='soon'?timing(a,now).distance-timing(b,now).distance:sort==='date'?timing(a,now).date-timing(b,now).date:timing(b,now).date-timing(a,now).date;events.sort(order);const categories=grouped?[...state.categories].sort((a,b)=>a.order-b.order):[{id:'all',name:'All events',color:'#a9c5ff',collapsed:false}];$('content').innerHTML=categories.map(c=>{const items=grouped?events.filter(e=>e.category===c.id):events;if(!items.length&&query)return '';return '<section class="group" data-category="'+esc(c.id)+'"><div class="group-head"><div class="group-title" data-action="collapse" data-id="'+esc(c.id)+'"><span class="dot" style="background:'+(/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#a9c5ff')+'"></span><h2>'+esc(c.name)+'</h2><small>'+items.length+'</small><span class="muted">'+(c.collapsed?'▸':'▾')+'</span></div>'+(grouped?'<button class="icon" data-action="edit-category" data-id="'+esc(c.id)+'" title="Edit category">⋯</button><span class="handle" draggable="true" data-type="category" data-id="'+esc(c.id)+'" title="Drag category">⠿</span>':'')+'</div>'+(c.collapsed&&grouped?'':items.length?items.map(e=>{const t=timing(e,now);return '<article class="event" data-event="'+esc(e.id)+'"><span class="handle" draggable="true" data-type="event" data-id="'+esc(e.id)+'" title="Drag to reorder">⠿</span><div class="event-info"><div class="event-name">'+esc(e.name)+'</div><p cl $('content').addEventListener('pointermove',ev=>{if(!touchDrag||touchDrag.pointer!==ev.pointerId)return;const t=touchDrag;if(Math.hypot(ev.clientX-t.x,ev.clientY-t.y)>8){t.moved=true;t.source.classList.add('dragging')}if(!t.moved)return;ev.preventDefault();const edge=75;if(ev.clientY<edge&&Date.now()-lastTouchScroll>35){window.scrollBy(0,-20);lastTouchScroll=Date.now()}else if(ev.clientY>innerHeight-edge&&Date.now()-lastTouchScroll>35){window.scrollBy(0,20);lastTouchScroll=Date.now()}document.querySelectorAll('.touch-target').forEach(el=>el.classList.remove('touch-target'));const node=document.elementFromPoint(ev.clientX,ev.clientY);const target=node?.closest(t.type==='category'?'.group':'.event,.group');if(target&&target!==t.source)target.classList.add('touch-target')},{passive:false});
$('content').addEventListener('pointerup',ev=>{if(!touchDrag||touchDrag.pointer!==ev.pointerId)return;const t=touchDrag;t.source.classList.remove('dragging');touchDrag=null;const node=document.elementFromPoint(ev.clientX,ev.clientY);document.querySelectorAll('.touch-target').forEach(el=>el.classList.remove('touch-target'));if(!t.moved||!node)return;const group=node.closest('.group'),targetEvent=node.closest('.event');if(t.type==='category'&&group){const list=[...state.categories].sort((a,b)=>a.order-b.order),i=list.findIndex(c=>c.id===t.id),j=list.findIndex(c=>c.id===group.dataset.category);if(i>=0&&j>=0){list.splice(j,0,list.splice(i,1)[0]);list.forEach((c,k)=>c.order=k)}}else if(t.type==='event'&&group){const moving=state.events.find(e=>e.id===t.id);if(moving){const dest=group.dataset.category==='all'?moving.category:group.dataset.category;moving.category=dest;const list=state.events.filter(e=>e.category===dest&&e.id!==moving.id).sort((a,b)=>a.order-b.order);const j=targetEvent?list.findIndex(e=>e.id===targetEvent.dataset.event):list.length;list.splice(j<0?list.length:j,0,moving);list.forEach((e,k)=>e.order=k)}}save();render()});
$('content').addEventListener('pointercancel',()=>{if(touchDrag)touchDrag.source.classList.remove('dragging');touchDrag=null;document.querySelectorAll('.touch-target').forEach(el=>el.classList.remove('touch-target'))});
$('content').addEventListener('dragstart',ev=>{const h=ev.target.closest('[draggable]');if(!h)return;if($('sort').value!=='manual'||$('search').value.trim()||$('filter').value!=='all'){ev.preventDefault();alert('Use Custom order with no active search or filter to reorder.');return;}dragged={type:h.dataset.type,id:h.dataset.id};ev.dataTransfer.effectAllowed='move'});$('content').addEventListener('dragover',ev=>{if(!dragged)return;const target=ev.target.closest(dragged.type==='category'?'.group':'.event, .group');if(target){ev.preventDefault();ev.dataTransfer.dropEffect='move'}});$('content').addEventListener('drop',ev=>{if(!dragged)return;ev.preventDefault();const group=ev.target.closest('.group'),event=ev.target.closest('.event');if(dragged.type==='category'&&group){const list=[...state.categories].sort((a,b)=>a.order-b.order),i=list.findIndex(c=>c.id===dragged.id),j=list.findIndex(c=>c.id===group.dataset.category);if(i>=0&&j>=0){list.splice(j,0,list.splice(i,1)[0]);list.forEach((c,k)=>c.order=k)}}else if(dragged.type==='event'&&group){const moving=state.events.find(e=>e.id===dragged.id);if(moving){const dest=group.dataset.category==='all'?moving.category:group.dataset.category;moving.category=dest;const list=state.events.filter(e=>e.category===dest&&e.id!==moving.id).sort((a,b)=>a.order-b.order);const index=event?list.findIndex(e=>e.id===event.dataset.event):list.length;list.splice(index<0?list.length:index,0,moving);list.forEach((e,k)=>e.order=k)}}dragged=null;save();render()});$('content').addEventListener('dragend',()=>dragged=null);
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='count-timer-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('File too large');const data=JSON.parse(await file.text());if(!Array.isArray(data.events)||!Array.isArray(data.categories)||data.events.length>10000)throw Error('Invalid backup');if(!confirm('Replace your current events and categories with this backup?'))return;state={categories:data.categories.filter(c=>typeof c.id==='string'&&typeof c.name==='string').map((c,i)=>({...c,order:i})),events:data.events.filter(e=>typeof e.id==='string'&&typeof e.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)).map((e,i)=>({...e,order:Number.isFinite(e.order)?e.order:i})),theme:data.theme==='light'?'light':'dark'};if(!state.categories.some(c=>c.id==='default'))state.categories.unshift({...base.categories[0]});state.events.forEach(e=>{if(!state.categories.some(c=>c.id===e.category))e.category='default'});save();render()}catch(err){alert('Import failed: '+err.message)}finally{ev.target.value=''}};let installPrompt=null;window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installPrompt=ev;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').classList.add('hidden')};window.addEventListener('appinstalled',()=>$('install').classList.add('hidden'));if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();setInterval(()=>{if(!document.hidden&&!touchDrag&&!dragged)render()},1000);
