name: Count Timer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check time-engine.js
          node --check storage.js
          node --check ui.js
          node --check sw.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs
